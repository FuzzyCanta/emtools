<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMTools CSV to JSON converter</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px;background:#f7f7f8;color:#111}
    .wrap{max-width:1800px;margin:0 auto}
    h1{font-size:18px;margin:0 0 12px}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
    .bar > *{margin:0}
    button,input[type="file"]{font:inherit}
    button{padding:8px 10px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
    button:hover{background:#f0f0f2}
    button:disabled{opacity:.5;cursor:not-allowed}
    .note{font-size:12px;color:#444;margin:8px 0 0}
    .panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
    .tableWrap{overflow:auto;max-height:65vh;margin-top:8px;border:1px solid #eee}
    table{width:100%;min-width:1100px;border-collapse:collapse}
    th,td{border:1px solid #eee;padding:6px;vertical-align:top;text-align:left}
    th{position:sticky;top:0;background:#fafafa;font-size:12px}
    td{white-space:pre-wrap;overflow-wrap:anywhere}
    .small{font-size:12px;color:#555}
    .status{font-size:12px;color:#333;margin-left:auto}
    .kpi{display:flex;gap:12px;flex-wrap:wrap}
    .kpi div{font-size:12px;color:#444}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    @media (max-width: 1100px){
      .wrap{max-width:none}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>EMTools CSV to JSON converter</h1>

  <div class="panel">
    <div class="bar">
      <input id="fileInput" type="file" accept=".csv,text/csv" />
      <button id="btnSaveJson" type="button" disabled>Download JSON</button>
      <span class="status" id="status">Select a CSV file to begin.</span>
    </div>

    <div class="kpi small">
      <div>Rows: <span id="kRows">0</span></div>
      <div>Output fields: <span id="kFields">8</span></div>
      <div class="mono" id="kFilename"></div>
    </div>

    <p class="note">
      Upload a CSV to preview it as a table and download JSON in the EMTools link format. Tags are exported as an array.
    </p>

    <div class="tableWrap" id="tableHost"></div>
  </div>

  <div class="panel" style="margin-top:12px;">
    <div class="small">JSON preview (read-only)</div>
    <textarea id="raw" readonly style="width:100%;min-height:220px;margin-top:6px;border:1px solid #ddd;border-radius:10px;padding:10px;box-sizing:border-box;background:#fff" class="mono"></textarea>
  </div>
</div>

<script>
  const OUTPUT_FIELDS = ['title', 'href', 'section', 'category', 'sectionOrder', 'tags', 'targetBlank', 'description'];
  let items = [];
  let filename = '';

  const fileInput = document.getElementById('fileInput');
  const btnSaveJson = document.getElementById('btnSaveJson');
  const tableHost = document.getElementById('tableHost');
  const statusEl = document.getElementById('status');
  const rawEl = document.getElementById('raw');
  const kRows = document.getElementById('kRows');
  const kFields = document.getElementById('kFields');
  const kFilename = document.getElementById('kFilename');

  function setStatus(message){
    statusEl.textContent = message;
  }

  function stripBom(text){
    return text && text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
  }

  function detectDelimiter(text){
    const firstLine = stripBom(text || '').split(/\r?\n/)[0] || '';
    let semicolons = 0;
    let commas = 0;
    let inQuotes = false;

    for (let i = 0; i < firstLine.length; i += 1){
      const char = firstLine[i];
      if (char === '"'){
        if (inQuotes && firstLine[i + 1] === '"'){
          i += 1;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (!inQuotes && char === ';'){
        semicolons += 1;
      } else if (!inQuotes && char === ','){
        commas += 1;
      }
    }

    if (semicolons && !commas) return ';';
    if (commas && !semicolons) return ',';
    return semicolons >= commas ? ';' : ',';
  }

  function parseCsv(text){
    const cleaned = stripBom(text || '').trim();
    const delimiter = detectDelimiter(cleaned);
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;

    for (let i = 0; i < cleaned.length; i += 1){
      const char = cleaned[i];
      if (char === '"'){
        if (inQuotes && cleaned[i + 1] === '"'){
          cell += '"';
          i += 1;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === delimiter && !inQuotes){
        row.push(cell);
        cell = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes){
        if (char === '\r' && cleaned[i + 1] === '\n') i += 1;
        row.push(cell);
        if (row.some(value => value.trim() !== '')) rows.push(row);
        row = [];
        cell = '';
      } else {
        cell += char;
      }
    }

    if (cell.length || row.length){
      row.push(cell);
      if (row.some(value => value.trim() !== '')) rows.push(row);
    }

    return rows;
  }

  function normalizeHeader(header, index){
    const base = String(header ?? '').trim().replace(/\d+$/, '').toLowerCase();
    const aliases = {
      sectiontitle: 'sectionTitle',
      sectiondescription: 'sectionDescription',
      sectionorder: 'sectionOrder',
      targetblank: 'targetBlank'
    };
    return aliases[base] || base || `column${index + 1}`;
  }

  function parseCsvValue(value, field){
    const text = String(value ?? '').trim();
    if (field === 'sectionOrder'){
      if (!text) return null;
      const number = Number(text);
      return Number.isFinite(number) ? number : null;
    }
    if (field === 'targetBlank') return /^(true|1|yes|y)$/i.test(text);
    if (field === 'tags') return text ? text.split(',').map(tag => tag.trim()).filter(Boolean) : [];
    return text;
  }

  function parseCsvToItems(text){
    const rows = parseCsv(text);
    if (!rows.length) throw new Error('The CSV is empty.');

    const positions = new Map();
    rows[0].forEach((header, index) => {
      const field = normalizeHeader(header, index);
      if (!positions.has(field)) positions.set(field, []);
      positions.get(field).push(index);
    });

    if (!positions.has('title') || !positions.has('href')){
      throw new Error('The CSV must include title and href columns.');
    }
    if (!positions.has('section') && !positions.has('sectionTitle')){
      throw new Error('The CSV must include a section column.');
    }

    return rows.slice(1).map(row => {
      const item = Object.create(null);
      positions.forEach((columnIndexes, field) => {
        const values = columnIndexes.map(index => row[index] ?? '').filter(value => value.trim() !== '');
        if (field === 'tags'){
          item[field] = values.flatMap(value => parseCsvValue(value, field));
        } else {
          item[field] = parseCsvValue(values[0] ?? '', field);
        }
      });
      return item;
    });
  }

  function toLinkRecord(item){
    const title = String(item.title ?? '').trim();
    const href = String(item.href ?? '').trim();
    if (!title || !href) throw new Error('Every data row must include a title and href.');

    const sectionTitle = String(item.sectionTitle ?? '').trim();
    const section = sectionTitle || String(item.section ?? '').trim() || 'documents';
    const order = item.sectionOrder;

    return {
      title,
      href,
      section,
      category: String(item.category ?? '').trim(),
      sectionOrder: Number.isFinite(order) ? order : 50,
      tags: Array.isArray(item.tags) ? item.tags.map(String).map(tag => tag.trim()).filter(Boolean) : [],
      targetBlank: Boolean(item.targetBlank),
      description: String(item.description ?? '').trim()
    };
  }

  function buildJsonText(){
    return JSON.stringify(items, null, 2);
  }

  function formatCellValue(value){
    if (Array.isArray(value)) return value.join(', ');
    return String(value ?? '');
  }

  function render(){
    kRows.textContent = items.length;
    kFields.textContent = OUTPUT_FIELDS.length;
    kFilename.textContent = filename ? `File: ${filename}` : '';
    rawEl.value = buildJsonText();
    btnSaveJson.disabled = items.length === 0;

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    OUTPUT_FIELDS.forEach(field => {
      const th = document.createElement('th');
      th.textContent = field;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    items.forEach(item => {
      const row = document.createElement('tr');
      OUTPUT_FIELDS.forEach(field => {
        const cell = document.createElement('td');
        cell.textContent = formatCellValue(item[field]);
        row.appendChild(cell);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    tableHost.replaceChildren(table);
  }

  async function loadCsv(file){
    try {
      if (!file.name.toLowerCase().endsWith('.csv')){
        throw new Error('Please select a CSV file.');
      }
      const parsed = parseCsvToItems(await file.text());
      const converted = parsed.map(toLinkRecord);
      items = converted;
      filename = file.name;
      render();
      setStatus(`Loaded ${items.length} row(s) from ${filename}.`);
    } catch (error) {
      items = [];
      filename = file.name || '';
      render();
      setStatus(`Failed to convert CSV: ${error.message}`);
    } finally {
      fileInput.value = '';
    }
  }

  function downloadJson(){
    const jsonFilename = `${filename.replace(/\.csv$/i, '') || 'data'}.json`;
    const blob = new Blob([buildJsonText()], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = jsonFilename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus(`Downloaded ${jsonFilename}.`);
  }

  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) loadCsv(fileInput.files[0]);
  });
  btnSaveJson.addEventListener('click', downloadJson);

  render();
</script>
</body>
</html>

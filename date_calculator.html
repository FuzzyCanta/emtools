<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <link rel="icon" href="favicon.ico" />

  <title>Timeline Date Interval Calculator</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --ink: #1f2a37;
      --muted: #6b7280;
      --border: #d0d4e0;
      --accent: #2563eb;
      --soft: #eef4ff;
      --danger: #b91c1c;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .wrap {
      max-width: 980px; 
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width:820px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: end;
    }

    .row>* {
      flex: 1;
    }

    .field {
      position: relative;
    }

    input,
    button {
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 34px 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
    }

    /* clear button used ONLY for text inputs (labels) and anchor date */
    .clearBtn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(107, 114, 128, .35);
      background: #fff;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clearBtn:hover {
      border-color: rgba(107, 114, 128, .7);
      color: var(--ink);
    }

    .btn {
      cursor: pointer;
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .btn.secondary {
      background: #fff;
      border-color: var(--border);
      color: var(--ink);
      font-weight: 600;
    }

    .mini {
      width: auto;
      white-space: nowrap;
    }

    .out {
      background: var(--soft);
      border: 1px solid rgba(37, 99, 235, .20);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      line-height: 1.35;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .danger {
      color: var(--danger);
      font-weight: 700;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      border-radius: 8px;
      overflow: hidden;
    }

    .table th,
    .table td {
      border-bottom: 1px solid rgba(107, 114, 128, .18);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .table th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      background: rgba(107, 114, 128, .06);
    }

    .kvs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-top: 6px;
    }

    @media (max-width:520px) {
      .kvs {
        grid-template-columns: 1fr;
      }
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px dashed rgba(107, 114, 128, .25);
      padding-bottom: 4px;
    }

    .kv b {
      font-weight: 700;
    }

    /* date inputs should NOT reserve space for a clear button */
    .dateNoClear {
      padding-right: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h2>Timeline (multiple dates)</h2>

      <div class="grid2">
        <div>
          <label>Anchor date</label>
          <div class="field">
            <input type="date" id="anchorDate" class="dateNoClear" />
            <!-- kept: clear button for anchor date only -->
            <button class="clearBtn" type="button" data-clear="anchorDate" aria-label="Clear anchor">×</button>
          </div>
        </div>

        <div>
          <label>Quick actions</label>
          <div class="row">
            <button class="btn secondary mini" id="addRowBtn" type="button">+ Add date</button>
            <button class="btn secondary mini" id="clearRowsBtn" type="button">Clear</button>
          </div>
        </div>
      </div>

      <div style="margin-top:10px; overflow:auto;">
        <table class="table">
          <thead>
            <tr>
              <th style="min-width:220px;">Label</th>
              <th style="min-width:170px;">Date</th>
              <th style="min-width:190px;">Since previous</th>
              <th style="min-width:190px;">Since anchor</th>
              <th style="min-width:120px;"></th>
            </tr>
          </thead>
          <tbody id="timelineBody"></tbody>
        </table>
      </div>

      <div class="out" id="timelineOut" style="margin-top:10px;">
        <div class="muted">Enter an anchor date, then add events.</div>
      </div>
    </div>
  </div>

  <script>
    /* DST-safe date math: parse YYYY-MM-DD manually, compute day diffs with Date.UTC */
    function parseYMD(value) {
      if (!value) return null;
      const p = value.split("-");
      if (p.length !== 3) return null;
      const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
      if (!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d)) return null;
      const local = new Date(y, m - 1, d);
      if (isNaN(local)) return null;
      if (local.getFullYear() !== y || local.getMonth() !== (m - 1) || local.getDate() !== d) return null;
      return { y, m, d, local };
    }
    function utcDayNumber(ymd) { return Math.floor(Date.UTC(ymd.y, ymd.m - 1, ymd.d) / 86400000); }
    function diffDaysYMD(a, b) { return utcDayNumber(b) - utcDayNumber(a); }
    function weeksDays(totalDays) { return { w: Math.floor(totalDays / 7), d: totalDays % 7 }; }
    function diffYMDLocal(startLocal, endLocal) {
      let y = endLocal.getFullYear() - startLocal.getFullYear();
      let m = endLocal.getMonth() - startLocal.getMonth();
      let d = endLocal.getDate() - startLocal.getDate();
      if (d < 0) {
        m--;
        const daysInPrevMonth = new Date(endLocal.getFullYear(), endLocal.getMonth(), 0).getDate();
        d += daysInPrevMonth;
      }
      if (m < 0) { y--; m += 12; }
      return { y, m, d };
    }
    function renderSpanText(startYMD, endYMD) {
      const total = diffDaysYMD(startYMD, endYMD);
      const wd = weeksDays(total);
      const ymd = diffYMDLocal(startYMD.local, endYMD.local);
      return `${wd.w}+${wd.d} ( ${ymd.y}y ${ymd.m}m ${ymd.d}d )`;
    }
    function formatYMD(ymd) {
      const m = String(ymd.m).padStart(2, "0");
      const d = String(ymd.d).padStart(2, "0");
      return `${ymd.y}-${m}-${d}`;
    }
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    /* Timeline rows */
    let rowId = 0;
    function makeRow(labelValue = "", dateValue = "") {
      rowId++;
      const id = rowId;
      const tr = document.createElement("tr");
      tr.dataset.rowId = String(id);
      tr.innerHTML = `
    <td>
      <div class="field">
        <input type="text" id="lbl-${id}" placeholder="e.g. Dose 1 / Follow-up" value="${escapeHtml(labelValue)}" />
        <button class="clearBtn" type="button" data-clear="lbl-${id}" aria-label="Clear label">×</button>
      </div>
    </td>
    <td>
      <input type="date" id="dt-${id}" class="dateNoClear" value="${dateValue}" />
    </td>
    <td id="prev-${id}" class="muted">—</td>
    <td id="anch-${id}" class="muted">—</td>
    <td><button type="button" class="btn secondary mini" id="del-${id}">Remove</button></td>
  `;
      tr.querySelector(`#lbl-${id}`).addEventListener("input", update);
      tr.querySelector(`#dt-${id}`).addEventListener("input", update);
      tr.querySelector(`#del-${id}`).addEventListener("click", () => { tr.remove(); update(); });
      return tr;
    }
    function getEvents() {
      const rows = Array.from(document.querySelectorAll("#timelineBody tr"));
      const all = rows.map(tr => {
        const id = tr.dataset.rowId;
        const raw = document.getElementById(`dt-${id}`)?.value || "";
        const ymd = parseYMD(raw);
        return { id, raw, ymd };
      });
      const datedSorted = all.filter(e => e.ymd).sort((a, b) => utcDayNumber(a.ymd) - utcDayNumber(b.ymd));
      return { all, datedSorted };
    }

    function update() {
      const out = document.getElementById("timelineOut");
      const anchor = parseYMD(document.getElementById("anchorDate").value);
      const { all, datedSorted } = getEvents();

      // reset cells
      for (const e of all) {
        const p = document.getElementById(`prev-${e.id}`);
        const a = document.getElementById(`anch-${e.id}`);
        if (p) { p.textContent = "—"; p.className = "muted"; }
        if (a) { a.textContent = "—"; a.className = "muted"; }
        if (e.raw && !e.ymd && a) {
          a.textContent = "Invalid date";
          a.className = "danger";
        }
      }

      if (!anchor) {
        out.innerHTML = `<div class="danger">Enter an anchor date to compute intervals.</div>`;
        return;
      }
      if (datedSorted.length === 0) {
        out.innerHTML = `<div class="muted">Add events (dates) to compute intervals.</div>`;
        return;
      }

      let prev = null;
      for (const e of datedSorted) {
        const prevCell = document.getElementById(`prev-${e.id}`);
        const anchCell = document.getElementById(`anch-${e.id}`);

        const da = diffDaysYMD(anchor, e.ymd);
        if (da < 0) {
          anchCell.textContent = "Before anchor";
          anchCell.className = "danger";
        } else {
          anchCell.textContent = renderSpanText(anchor, e.ymd);
          anchCell.className = "";
        }

        if (!prev) {
          prevCell.textContent = "—";
          prevCell.className = "muted";
        } else {
          prevCell.textContent = renderSpanText(prev.ymd, e.ymd);
          prevCell.className = "";
        }
        prev = e;
      }

      const validAfterAnchor = datedSorted.filter(e => diffDaysYMD(anchor, e.ymd) >= 0);
      if (validAfterAnchor.length === 0) {
        out.innerHTML = `<div class="danger">All event dates are before the anchor date.</div>`;
        return;
      }
      const latest = validAfterAnchor[validAfterAnchor.length - 1].ymd;

      const total = diffDaysYMD(anchor, latest);
      const wd = weeksDays(total);
      const ymd = diffYMDLocal(anchor.local, latest.local);

      out.innerHTML = `
    <div><b>Total interval (anchor → latest event)</b></div>
    <div class="kvs" style="margin-top:6px;">
      <div class="kv"><span>Anchor date</span><b>${formatYMD(anchor)}</b></div>
      <div class="kv"><span>Latest event</span><b>${formatYMD(latest)}</b></div>
      <div class="kv"><span>Total days</span><b>${total}</b></div>
      <div class="kv"><span>Weeks + days</span><b>${wd.w} + ${wd.d}</b></div>
      <div class="kv"><span>Years / months / days</span><b>${ymd.y}y ${ymd.m}m ${ymd.d}d</b></div>
    </div>
  `;
    }

    /* Clear buttons (only those that exist: anchor + labels) */
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-clear]");
      if (!btn) return;
      const id = btn.getAttribute("data-clear");
      const el = document.getElementById(id);
      if (!el) return;
      el.value = "";
      el.dispatchEvent(new Event("input", { bubbles: true }));
    });

    /* Init */
    (function init() {
      const body = document.getElementById("timelineBody");
      body.appendChild(makeRow("Event 1", ""));
      body.appendChild(makeRow("Event 2", ""));

      document.getElementById("anchorDate").addEventListener("input", update);
      document.getElementById("addRowBtn").addEventListener("click", () => { body.appendChild(makeRow("", "")); update(); });
      document.getElementById("clearRowsBtn").addEventListener("click", () => { body.innerHTML = ""; update(); });

      update();
    })();
  </script>
</body>

</html>
